# Momex Configuration - PostgreSQL Backend
# Use with: config = MomexConfig.from_yaml("config_postgres.yaml")

llm:
  provider: openai  # openai, azure, anthropic, deepseek, qwen
  model: gpt-4o
  # Prefer the MOMEX_LLM_API_KEY env var over storing the key here.
  api_key: ""
  # api_base is required for azure, optional elsewhere.
  api_base: ""
  temperature: 0.0

# Optional. If omitted, embedding settings are inferred from `llm`
# (supported when llm.provider is openai or azure).
embedding:
  provider: openai  # openai, azure
  model: text-embedding-3-small
  # Falls back to llm.api_key when the provider matches.
  api_key: ""
  api_base: ""
  # dimensions: 1536

storage:
  backend: postgres
  # Prefer the MOMEX_STORAGE_POSTGRES_URL env var over storing credentials here.
  postgres_url: "postgresql://<user>:<password>@localhost:5432/momex"
  # Leave empty to derive the schema from the collection name.
  postgres_schema: ""
  postgres_pool_min: 2
  postgres_pool_max: 10
  # Set true for Supabase / PgBouncer (disables prepared statements).
  postgres_pgbouncer: false
